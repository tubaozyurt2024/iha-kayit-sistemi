services:
  postgres:
    image: postgres:16-alpine
    container_name: iha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ihadb
      POSTGRES_USER: iha
      POSTGRES_PASSWORD: iha
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - iha-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iha -d ihadb"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  iha-pgdata:
